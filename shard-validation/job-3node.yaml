apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validation-3node
  labels:
    app: shard-validation
spec:
  completions: 8
  parallelism: 6
  completionMode: Indexed
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: shard-validation
    spec:
      restartPolicy: Never
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shard-validation
      containers:
        - name: validator
          image: shard-validator:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - "python validate_shard.py && sleep 10"
          env:
            - name: DATA_DIR
              value: "/app/data"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "1"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "64Mi"